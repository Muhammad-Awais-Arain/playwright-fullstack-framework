name: Playwright - Automated Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        default: "dev"
        options:
          - "dev"
          - "staging"
          - "production"
      project:
        description: "Select Project"
        required: true
        type: choice
        default: "ui"
        options:
          - "ui"
          - "ApiAutomation"
      tags:
        description: "Select Tags"
        required: true
        type: choice
        default: "DEMO"
        options:
          - "Companies"
          - "users"
          - "calculator"
          - "DEMO"
      BASE_URL:
        description: "Provide Base URL"
        required: false
        type: string
      DEMO_URL:
        description: "Provide DEMO URL"
        required: false
        type: string
      CALCULATOR_URL:
        description: "Provide Calculator URL"
        required: false
        type: string

jobs:
  automated-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Create environment file
        run: |
          ENV_FILE="./config/${{ github.event.inputs.environment }}.env"
          echo "${{ github.event.inputs.environment | capitalize }} environment selected"
          echo "ENV=${{ github.event.inputs.environment }}" >> $ENV_FILE
          echo "BASE_URL=${{ github.event.inputs.BASE_URL }}" >> $ENV_FILE
          echo "DEMO_URL=${{ github.event.inputs.DEMO_URL }}" >> $ENV_FILE
          echo "CALCULATOR_URL=${{ github.event.inputs.CALCULATOR_URL }}" >> $ENV_FILE

      - name: Print .env file
        run: |
          cat ./config/*.env
          echo "Logs env variables created"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: ENV=${{ github.event.inputs.environment }} npx playwright test --project=${{ github.event.inputs.project }} --grep=${{ github.event.inputs.tags }} --workers=10

      - name: Generate Allure Report
        if: always()
        run: npx allure generate ./allure-results --clean

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
